[package]
name = "z-request"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Pooled outbound REST and gRPC clients for services: declarative YAML/env configuration, end-user credential forwarding, retries and circuit breaking."
readme = "README.md"
keywords = ["client", "pool", "grpc", "rest", "microservices"]
categories = ["network-programming", "web-programming::http-client"]

[features]
default = ["rest", "grpc", "tls", "yaml"]
# REST transport over reqwest (HTTP/1.1).
rest = ["dep:bytes", "dep:reqwest"]
# gRPC transport over tonic (HTTP/2).
grpc = ["dep:tonic"]
# `https://` endpoints, custom CAs and client certificates for both transports: rustls with the
# `ring` provider (no C toolchain), verified against the platform's trust store.
tls = [
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "reqwest?/rustls-no-provider",
    "tokio/net",
    "tonic?/tls-ring",
]
# YAML configuration files: `ConfigSource::yaml_file` / `yaml_str`.
yaml = ["dep:serde-saphyr"]

[dependencies]
bytes = { version = "1", optional = true }
# Retry jitter (not security-sensitive).
fastrand = "2.5"
# Telemetry through the facades only: the host installs a recorder / subscriber, or nothing.
metrics = "0.24"
reqwest = { version = "0.13", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", optional = true }
thiserror = "2"
tonic = { version = "0.14", default-features = false, features = ["channel"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The pool's waiting, timers and background closing. `rt` for `Handle`, `time` for timeouts and
# the hold timer, `sync` for handing connections to waiting requests.
tokio = { version = "1.54", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
# Records metrics and spans in tests.
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# Test certificates for the TLS tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# A gRPC service (health checking) to test against, with a server.
tonic = { version = "0.14", default-features = false, features = ["router", "server"] }
tonic-health = { version = "0.14", default-features = false }
tokio-stream = { version = "0.1", features = ["net"] }
# A tiny HTTPS server for the TLS tests.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
